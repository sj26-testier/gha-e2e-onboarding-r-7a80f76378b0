name: Deploy Beta
on: {deployment: {}, deployment_status: {}}
permissions: {}
env:
  GITHUB_REF_NAME: wrong-workflow-name
  GITHUB_REF_TYPE: wrong-workflow-type
jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF_NAME: wrong-job-name
      GITHUB_REF_TYPE: wrong-job-type
    outputs:
      evidence_hash: ${{ steps.probe.outputs.evidence_hash }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/observe
        env:
          OBSERVATION_KIND: action-process
          GITHUB_REF_NAME: wrong-step-name
          GITHUB_REF_TYPE: wrong-step-type
      - id: probe
        env:
          CTX_SHA: ${{ github.sha }}
          CTX_REF: ${{ github.ref }}
          CTX_REF_NAME: ${{ github.ref_name }}
          CTX_REF_TYPE: ${{ github.ref_type }}
          CTX_EVENT_NAME: ${{ github.event_name }}
          CTX_WORKFLOW: ${{ github.workflow }}
          CTX_WORKFLOW_REF: ${{ github.workflow_ref }}
          CTX_WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_MARKER: beta-at-deployment
          GITHUB_REF_NAME: wrong-step-name
          GITHUB_REF_TYPE: wrong-step-type
        run: python3 deployment-probe.py
